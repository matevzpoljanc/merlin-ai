[tool.poetry]
name = "merlin-ai"
version = "1.0.1"
description = "AI models built on Python dataclasses and enums"
authors = ["Matevz Poljanc", "Miha Grcar"]
readme = "README.md"
packages = [{include = "merlin_ai"}]
repository = "https://github.com/matevzpoljanc/merlin-ai"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
# Retain the existing LiteLLM range on older Python versions. On 3.14,
# use a release that explicitly requires compatible Pydantic and tiktoken.
litellm = [
    {version = "^1.55.3", python = "<3.14"},
    {version = ">=1.106.4,<2.0.0", python = ">=3.14"},
]
tiktoken = ">=0.12.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pylint = [
    {version = "^3.3.9", python = "<3.10"},
    {version = "^4.0.0", python = ">=3.10"},
]
black = [
    {version = "^25.9.0", python = "<3.10"},
    {version = "^26.3.1", python = ">=3.10"},
]
load-dotenv = "^0.1.0"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
